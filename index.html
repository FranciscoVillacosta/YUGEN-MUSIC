<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>YŪGEN · Inicio</title>
  <style>
    /* Estilos del desplegable de búsqueda de YouTube */
    .yt-results-dropdown {
      display: none;
      position: absolute;
      top: 52px;
      left: 0;
      width: 100%;
      max-height: 420px;
      overflow-y: auto;
      background: #141022;
      border: 1px solid #2d224b;
      border-radius: 10px;
      z-index: 1000;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
    }
    .yt-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid #1f1836;
      cursor: pointer;
      transition: background 0.2s;
    }
    .yt-item:hover {
      background: #231b40;
    }
    .yt-thumb {
      width: 56px;
      height: 42px;
      object-fit: cover;
      border-radius: 6px;
    }
    .yt-info {
      flex: 1;
      min-width: 0;
    }
    .yt-title {
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .yt-channel {
      color: #9d8ec2;
      font-size: 11px;
      margin: 3px 0 0 0;
    }
    .btn-yt-dl {
      background: #00f5d4;
      color: #000;
      font-weight: 800;
      font-size: 11px;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Fondo oscuro al abrir el menú en celular -->
  <div class="menu-overlay" id="menuOverlay"></div>

  <div class="app-layout">
    <!-- BARRA LATERAL IZQUIERDA -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <div class="brand-badge">♫</div>
          <span class="brand-name">YŪGEN</span>
        </div>
        <button type="button" class="btn-close-menu" id="btnCloseMenu">✕</button>
      </div>

      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item active">
          <span class="nav-icon">🏠</span>
          <span>Inicio</span>
        </a>
        <a href="carga.html" class="nav-item">
          <span class="nav-icon">⭳</span>
          <span>Descargar</span>
        </a>
      </nav>

      <div class="sidebar-section">
        <p class="sidebar-subtitle">TU BIBLIOTECA</p>
        <input type="file" id="audioPicker" accept="audio/*" multiple style="display: none;" />
        <button type="button" id="btnUpload" class="btn-sidebar-add">
          <span>+</span> Subir Archivos
        </button>
      </div>

      <div class="sidebar-genres">
        <p class="sidebar-subtitle">GÉNEROS</p>
        <button type="button" class="genre-link active" data-genre="Todos">Todos</button>
        <button type="button" class="genre-link" data-genre="Lo-Fi">Lo-Fi</button>
        <button type="button" class="genre-link" data-genre="Trap / Rap">Trap / Rap</button>
        <button type="button" class="genre-link" data-genre="Rock">Rock</button>
        <button type="button" class="genre-link" data-genre="Pop">Pop</button>
        <button type="button" class="genre-link" data-genre="Otros">Otros</button>
      </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
      <!-- Barra superior con buscador -->
      <header class="top-nav">
        <button type="button" class="btn-menu-toggle" id="btnMenuToggle" aria-label="Abrir Menú">
          ☰
        </button>

        <div class="search-wrapper" style="position: relative;">
          <span class="search-icon">🔍</span>
          <input type="text" id="localSearchInput" placeholder="Busca canciones en YouTube o en tu biblioteca..." autocomplete="off" />
          
          <!-- Lista desplegable de YouTube -->
          <div id="ytDropdown" class="yt-results-dropdown"></div>
        </div>
      </header>

      <section class="shelf-section">
        <div class="shelf-header">
          <h2 id="sectionTitle">Tus Canciones</h2>
          <span id="trackCount" class="shelf-count">0 canciones</span>
        </div>

        <div id="emptyState" class="empty-shelf" style="display: none;">
          <div class="empty-icon">📁</div>
          <h3>Tu biblioteca está vacía</h3>
          <p>Sube canciones desde tu dispositivo o busca en YouTube arriba.</p>
        </div>

        <div id="songsGrid" class="cards-grid"></div>
      </section>
    </main>
  </div>

  <!-- REPRODUCTOR FIJO INFERIOR -->
  <footer class="bottom-player">
    <div class="current-track-info">
      <div class="mini-cover" id="playerMiniCover">♫</div>
      <div class="track-meta-box">
        <p id="nowPlayingTitle" class="now-title">Selecciona una pista</p>
        <p id="nowPlayingMeta" class="now-sub">YŪGEN Music</p>
      </div>
    </div>

    <div class="player-center">
      <div class="controls">
        <button type="button" class="btn-ctrl" id="prevBtn">⏮</button>
        <button type="button" class="btn-ctrl play" id="playPauseBtn">▶</button>
        <button type="button" class="btn-ctrl" id="nextBtn">⏭</button>
      </div>

      <div class="progress-container">
        <span id="currentTime">0:00</span>
        <input type="range" id="progressBar" min="0" max="100" value="0" />
        <span id="totalDuration">0:00</span>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
