<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>YŪGEN · Reproductor</title>
</head>
<body>

  <!-- Barra Superior -->
  <header class="top-bar">
    <div class="brand">
      <div class="brand-badge">♫</div>
      <span class="brand-name">YŪGEN <span class="brand-sub">PLAYER</span></span>
    </div>
    
    <!-- Buscador en tiempo real de tus archivos locales -->
    <div class="search-box">
      <input type="text" id="localSearchInput" placeholder="Buscar en mi música..." />
    </div>

    <!-- Acciones: Cargar local e ir a la página de descarga -->
    <div class="header-actions">
      <input type="file" id="audioPicker" accept="audio/*" multiple style="display: none;" />
      <button type="button" id="btnUpload" class="btn-secondary" title="Agregar archivos">
        <span>+</span> Subir
      </button>
      <a href="download.html" class="btn-primary nav-link">
        <span>⭳</span> Descargar
      </a>
    </div>
  </header>

  <main class="content-area">
    <!-- Pestañas de Filtro por Género -->
    <div class="genre-tabs" id="genreTabs">
      <button type="button" class="genre-pill active" data-genre="Todos">Todos</button>
      <button type="button" class="genre-pill" data-genre="Lo-Fi">Lo-Fi</button>
      <button type="button" class="genre-pill" data-genre="Trap / Rap">Trap / Rap</button>
      <button type="button" class="genre-pill" data-genre="Rock">Rock</button>
      <button type="button" class="genre-pill" data-genre="Pop">Pop</button>
      <button type="button" class="genre-pill" data-genre="Electro">Electro</button>
      <button type="button" class="genre-pill" data-genre="Otros">Otros</button>
    </div>

    <!-- Encabezado de la lista -->
    <div class="playlist-header">
      <h2 id="currentSectionTitle">Todos los temas</h2>
      <span id="trackCount" class="track-count">0 pistas</span>
    </div>

    <!-- Estado vacío -->
    <div id="emptyState" class="empty-state">
      <div class="empty-icon">📁</div>
      <p class="empty-title">No hay música aquí</p>
      <p class="empty-sub">Carga canciones desde tu celular o ve a <a href="download.html" style="color: #c084fc;">Descargar</a> para bajar nuevos temas.</p>
    </div>

    <ul id="playlistView" class="playlist-view"></ul>
  </main>

  <!-- Modal rápido para asignar género a una pista -->
  <div id="genreModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3>Asignar Género</h3>
      <p id="modalTrackName" class="modal-track-name">Nombre de pista</p>
      <select id="genreSelect">
        <option value="Lo-Fi">Lo-Fi</option>
        <option value="Trap / Rap">Trap / Rap</option>
        <option value="Rock">Rock</option>
        <option value="Pop">Pop</option>
        <option value="Electro">Electro</option>
        <option value="Otros">Otros</option>
      </select>
      <div class="modal-actions">
        <button type="button" id="modalCancelBtn" class="btn-cancel">Cancelar</button>
        <button type="button" id="modalSaveBtn" class="btn-save">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Barra Inferior del Reproductor -->
  <footer class="bottom-player">
    <div class="current-track-info">
      <p id="nowPlayingTitle" class="now-title">Selecciona una pista</p>
      <p id="nowPlayingMeta" class="now-meta">YŪGEN Music</p>
    </div>

    <div class="player-center">
      <div class="controls">
        <button type="button" class="btn-ctrl" id="prevBtn" title="Anterior">⏮</button>
        <button type="button" class="btn-ctrl play" id="playPauseBtn" title="Reproducir">▶</button>
        <button type="button" class="btn-ctrl" id="nextBtn" title="Siguiente">⏭</button>
      </div>

      <div class="progress-container">
        <span id="currentTime">0:00</span>
        <input type="range" id="progressBar" min="0" max="100" value="0" />
        <span id="totalDuration">0:00</span>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
