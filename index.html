<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CyberSound - Reproductor</title>
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(18, 24, 38, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00f2fe;
      --accent-purple: #9d4edd;
      --accent-pink: #ff007f;
      --text: #ffffff;
      --text-muted: #8b9bb4;
      --panel-blur: blur(24px);
      --touch-size: 46px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(157, 78, 221, 0.22) 0%, transparent 50%),
        radial-gradient(circle at 90% 90%, rgba(0, 242, 254, 0.22) 0%, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 0.75rem) 1rem env(safe-area-inset-bottom, 1rem);
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin: auto;
    }

    /* CABECERA RESPONSIVA */
    .top-nav {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      width: 100%;
    }

    .nav-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .logo-badge {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      user-select: none;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(0, 242, 254, 0.12);
      border: 1px solid rgba(0, 242, 254, 0.35);
      color: var(--accent-cyan);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.45rem 0.85rem;
      border-radius: 20px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .nav-btn:active {
      transform: scale(0.96);
      background: var(--accent-cyan);
      color: #07090e;
    }

    /* BUSCADOR EXPANDIDO */
    .search-wrapper {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.55rem 1rem 0.55rem 2.2rem;
      border-radius: 12px;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
    }

    .search-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.8rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* TARJETA DEL REPRODUCTOR */
    .card {
      background: var(--card-bg);
      backdrop-filter: var(--panel-blur);
      -webkit-backdrop-filter: var(--panel-blur);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 1.4rem 1.25rem 1.2rem;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      position: relative;
      overflow: hidden;
      width: 100%;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
    }

    /* VINILO Y ESPECTRO */
    .visualizer-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
    }

    .vinyl-wrapper {
      position: relative;
      width: 155px;
      height: 155px;
      margin: 0.1rem auto;
    }

    .vinyl {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, #222 25%, #111 26%, #1a1a1a 45%, #111 46%, #222 65%, #111 66%, #050505 100%);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85), 0 0 25px rgba(0, 242, 254, 0.2);
      border: 3px solid #222;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: rotateVinyl 8s linear infinite;
      animation-play-state: paused;
    }

    .vinyl.spinning {
      animation-play-state: running;
    }

    .vinyl-label {
      width: 38%;
      height: 38%;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 3px solid #111;
    }

    .vinyl-label::after {
      content: '';
      width: 12px;
      height: 12px;
      background: #07090e;
      border-radius: 50%;
      border: 2px solid #333;
    }

    @keyframes rotateVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    canvas {
      width: 100%;
      height: 70px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.4);
      display: block;
    }

    /* INFORMACIÓN DE PISTA */
    .track-meta {
      text-align: center;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 0.25rem;
    }

    .track-title {
      font-size: 1.15rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }

    .track-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    /* BARRA DE TIEMPO TÁCTIL */
    .time-rail-box {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      user-select: none;
    }

    .rail-hitbox {
      flex: 1;
      height: 32px;
      display: flex;
      align-items: center;
      cursor: pointer;
      touch-action: none;
    }

    .rail {
      width: 100%;
      height: 7px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      position: relative;
      overflow: hidden;
    }

    .rail-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
      border-radius: 10px;
      width: 0%;
      pointer-events: none;
    }

    /* CONTROLES */
    .controls {
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      gap: 0.4rem;
      padding: 0.2rem 0;
    }

    button {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      touch-action: manipulation;
      transition: transform 0.15s ease, color 0.15s ease;
    }

    button:active {
      transform: scale(0.9);
    }

    .btn-main {
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      color: #05070d;
      font-size: 1.4rem;
      box-shadow: 0 0 22px rgba(0, 242, 254, 0.45);
    }

    .btn-sub {
      width: var(--touch-size);
      height: var(--touch-size);
      font-size: 1.2rem;
      color: var(--text-muted);
    }

    .btn-sub.active {
      color: var(--accent-cyan);
      text-shadow: 0 0 12px var(--accent-cyan);
    }

    /* VOLUMEN */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.4rem;
      border-top: 1px solid var(--border);
    }

    .vol-ctrl {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
    }

    input[type="range"] {
      accent-color: var(--accent-cyan);
      cursor: pointer;
      width: 100px;
      height: 6px;
    }

    /* AJUSTE PARA COMPUTADORAS */
    @media (min-width: 600px) {
      .top-nav {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
      .search-wrapper {
        max-width: 220px;
      }
      .vinyl-wrapper {
        width: 175px;
        height: 175px;
      }
      .card {
        padding: 1.6rem;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- BARRA SUPERIOR REORGANIZADA -->
    <header class="top-nav">
      <div class="nav-header-row">
        <span class="logo-badge">CYBERSOUND</span>
        <a href="agregar.html" class="nav-btn">＋ Gestionar Música</a>
      </div>
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="searchInput" placeholder="Buscar canción y presionar Enter...">
      </div>
    </header>

    <!-- TARJETA DEL REPRODUCTOR -->
    <main class="card">
      <div class="visualizer-stage">
        <div class="vinyl-wrapper">
          <div class="vinyl" id="vinyl">
            <div class="vinyl-label"></div>
          </div>
        </div>
        <canvas id="visualizerCanvas"></canvas>
      </div>

      <div class="track-meta">
        <div class="track-title" id="trackTitle">Cargando biblioteca...</div>
        <div class="track-subtitle" id="trackSubtitle">Sin reproducción activa</div>
      </div>

      <div class="time-rail-box">
        <span id="currentTime">0:00</span>
        <div class="rail-hitbox" id="railHitbox">
          <div class="rail">
            <div class="rail-fill" id="railFill"></div>
          </div>
        </div>
        <span id="duration">0:00</span>
      </div>

      <div class="controls">
        <button class="btn-sub" id="shuffleBtn" title="Aleatorio">🔀</button>
        <button class="btn-sub" id="prevBtn" title="Anterior">⏮</button>
        <button class="btn-main" id="playBtn" title="Reproducir">▶</button>
        <button class="btn-sub" id="nextBtn" title="Siguiente">⏭</button>
        <button class="btn-sub" id="loopBtn" title="Repetir">🔁</button>
      </div>

      <div class="bottom-bar">
        <div class="vol-ctrl">
          <span id="volIcon" style="cursor: pointer; user-select: none;">🔊</span>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
        </div>
        <span id="queueBadge" style="font-size: 0.75rem; color: var(--text-muted);">0 canciones</span>
      </div>
    </main>
  </div>

  <audio id="audioEl" crossorigin="anonymous" playsinline></audio>

  <script>
    /* ==========================================================
       1. BASE DE DATOS LOCAL (INDEXEDDB)
       ========================================================== */
    const DB_NAME = "CyberSoundDB";
    const STORE_NAME = "audioTracks";

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbGetAllTracks() {
      const db = await openDatabase();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    // Limpia nombres descargados de YouTube (quita IDs tipo [_syUNepx...])
    function cleanTrackName(rawName) {
      return rawName
        .replace(/\.[^/.]+$/, "")
        .replace(/\s*\[[a-zA-Z0-9_-]{8,15}\]\s*$/, "")
        .trim();
    }

    /* ==========================================================
       2. ESTADO DEL REPRODUCTOR
       ========================================================== */
    let playlist = [];
    let currentIndex = -1;
    let isShuffle = false;
    let loopMode = 0;

    let audioCtx = null;
    let analyser = null;
    let sourceNode = null;
    let isAudioCtxInit = false;

    const audio = document.getElementById("audioEl");
    const vinyl = document.getElementById("vinyl");
    const canvas = document.getElementById("visualizerCanvas");
    const ctx = canvas.getContext("2d");
    const playBtn = document.getElementById("playBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const loopBtn = document.getElementById("loopBtn");
    const volumeSlider = document.getElementById("volumeSlider");
    const volIcon = document.getElementById("volIcon");
    const railHitbox = document.getElementById("railHitbox");
    const railFill = document.getElementById("railFill");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const trackTitle = document.getElementById("trackTitle");
    const trackSubtitle = document.getElementById("trackSubtitle");
    const queueBadge = document.getElementById("queueBadge");
    const searchInput = document.getElementById("searchInput");

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width || canvas.parentElement.clientWidth;
      canvas.height = 70;
    }
    window.addEventListener("resize", resizeCanvas);

    function initWebAudio() {
      if (isAudioCtxInit) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 128;

      sourceNode = audioCtx.createMediaElementSource(audio);
      sourceNode.connect(analyser);
      analyser.connect(audioCtx.destination);

      isAudioCtxInit = true;
      renderSpectrum();
    }

    function renderSpectrum() {
      requestAnimationFrame(renderSpectrum);
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const barWidth = (canvas.width / bufferLength) * 1.5;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        const barHeight = (dataArray[i] / 255) * canvas.height;
        const grad = ctx.createLinearGradient(0, canvas.height, 0, 0);
        grad.addColorStop(0, '#00f2fe');
        grad.addColorStop(0.5, '#9d4edd');
        grad.addColorStop(1, '#ff007f');

        ctx.fillStyle = grad;
        ctx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);
        x += barWidth;
      }
    }

    function syncMediaSession(track) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: cleanTrackName(track.name),
          artist: 'CyberSound Local',
          album: 'Mi Música'
        });
        navigator.mediaSession.setActionHandler('play', togglePlay);
        navigator.mediaSession.setActionHandler('pause', togglePlay);
        navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
        navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
      }
    }

    function loadTrack(index, autoPlay = true) {
      if (index < 0 || index >= playlist.length) return;
      currentIndex = index;
      const track = playlist[currentIndex];

      if (track.objectUrl) URL.revokeObjectURL(track.objectUrl);
      track.objectUrl = URL.createObjectURL(track.blob);

      audio.src = track.objectUrl;
      trackTitle.textContent = cleanTrackName(track.name);
      trackSubtitle.textContent = `Pista ${currentIndex + 1} de ${playlist.length}`;

      syncMediaSession(track);

      if (autoPlay) {
        initWebAudio();
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        audio.play().catch(() => {});
      }
    }

    function togglePlay() {
      if (playlist.length === 0) return;
      if (currentIndex === -1) {
        loadTrack(0);
        return;
      }
      initWebAudio();
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();

      if (audio.paused) audio.play();
      else audio.pause();
    }

    function nextTrack() {
      if (playlist.length === 0) return;
      if (isShuffle && playlist.length > 1) {
        let rand;
        do {
          rand = Math.floor(Math.random() * playlist.length);
        } while (rand === currentIndex);
        loadTrack(rand);
        return;
      }
      let next = currentIndex + 1;
      if (next >= playlist.length) {
        if (loopMode === 1) next = 0;
        else return;
      }
      loadTrack(next);
    }

    function prevTrack() {
      if (playlist.length === 0) return;
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
      }
      let prev = currentIndex - 1;
      if (prev < 0) {
        prev = loopMode === 1 ? playlist.length - 1 : 0;
      }
      loadTrack(prev);
    }

    function formatTime(sec) {
      if (isNaN(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // BUSCADOR RÁPIDO CON ENTER
    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const query = searchInput.value.trim().toLowerCase();
        if (!query) return;
        const foundIndex = playlist.findIndex(t => t.name.toLowerCase().includes(query));
        if (foundIndex !== -1) {
          loadTrack(foundIndex, true);
          searchInput.blur();
        }
      }
    });

    // CARGA INICIAL DESDE INDEXEDDB
    window.addEventListener("DOMContentLoaded", async () => {
      resizeCanvas();
      try {
        const saved = await dbGetAllTracks();
        if (saved && saved.length > 0) {
          playlist = saved;
          queueBadge.textContent = `${playlist.length} canciones`;
          loadTrack(0, false);
        } else {
          trackTitle.textContent = "Sin canciones";
          trackSubtitle.textContent = 'Pulsa "＋ Gestionar Música" arriba';
          queueBadge.textContent = "0 canciones";
        }
      } catch (err) {
        console.error("Error al leer IndexedDB:", err);
      }
    });

    // EVENTOS DE CONTROL
    playBtn.addEventListener("click", togglePlay);
    nextBtn.addEventListener("click", nextTrack);
    prevBtn.addEventListener("click", prevTrack);

    audio.addEventListener("play", () => {
      playBtn.textContent = "⏸";
      vinyl.classList.add("spinning");
    });

    audio.addEventListener("pause", () => {
      playBtn.textContent = "▶";
      vinyl.classList.remove("spinning");
    });

    audio.addEventListener("timeupdate", () => {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      railFill.style.width = `${pct}%`;
      currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener("loadedmetadata", () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("ended", () => {
      if (loopMode === 2) {
        audio.currentTime = 0;
        audio.play();
      } else {
        nextTrack();
      }
    });

    // SEEK PRECISO TÁCTIL Y RATÓN
    function seekAudio(e) {
      if (!audio.duration) return;
      const rect = railHitbox.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const pos = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      audio.currentTime = pos * audio.duration;
    }

    railHitbox.addEventListener("click", seekAudio);
    railHitbox.addEventListener("touchmove", seekAudio, { passive: true });

    // VOLUMEN
    volumeSlider.addEventListener("input", (e) => {
      audio.volume = parseFloat(e.target.value);
      volIcon.textContent = audio.volume === 0 ? "🔇" : "🔊";
    });

    volIcon.addEventListener("click", () => {
      if (audio.volume > 0) {
        audio.dataset.prevVol = audio.volume;
        audio.volume = 0;
        volumeSlider.value = 0;
        volIcon.textContent = "🔇";
      } else {
        const prev = audio.dataset.prevVol || 0.8;
        audio.volume = prev;
        volumeSlider.value = prev;
        volIcon.textContent = "🔊";
      }
    });

    // SHUFFLE Y LOOP
    shuffleBtn.addEventListener("click", () => {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle("active", isShuffle);
    });

    loopBtn.addEventListener("click", () => {
      loopMode = (loopMode + 1) % 3;
      if (loopMode === 0) {
        loopBtn.textContent = "🔁";
        loopBtn.classList.remove("active");
      } else if (loopMode === 1) {
        loopBtn.textContent = "🔁";
        loopBtn.classList.add("active");
      } else {
        loopBtn.textContent = "🔂";
        loopBtn.classList.add("active");
      }
    });

    // ATAJOS TECLADO PC
    window.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT") return;
      if (e.code === "Space") {
        e.preventDefault();
        togglePlay();
      } else if (e.code === "ArrowRight") {
        audio.currentTime = Math.min(audio.currentTime + 5, audio.duration || 0);
      } else if (e.code === "ArrowLeft") {
        audio.currentTime = Math.max(audio.currentTime - 5, 0);
      }
    });
  </script>
</body>
</html>
