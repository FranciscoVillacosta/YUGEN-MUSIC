<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>YŪGEN · Inicio</title>
</head>
<body>

  <div class="app-layout">
    <!-- BARRA LATERAL IZQUIERDA -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-badge">♫</div>
        <span class="brand-name">YŪGEN</span>
      </div>

      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item active">
          <span class="nav-icon">🏠</span>
          <span>Inicio</span>
        </a>
        <a href="carga.html" class="nav-item">
          <span class="nav-icon">⭳</span>
          <span>Descargar</span>
        </a>
      </nav>

      <div class="sidebar-section">
        <p class="sidebar-subtitle">TU BIBLIOTECA</p>
        <input type="file" id="audioPicker" accept="audio/*" multiple style="display: none;" />
        <button type="button" id="btnUpload" class="btn-sidebar-add">
          <span>+</span> Subir Archivos
        </button>
      </div>

      <div class="sidebar-genres">
        <p class="sidebar-subtitle">GÉNEROS</p>
        <button type="button" class="genre-link active" data-genre="Todos">Todos</button>
        <button type="button" class="genre-link" data-genre="Lo-Fi">Lo-Fi</button>
        <button type="button" class="genre-link" data-genre="Trap / Rap">Trap / Rap</button>
        <button type="button" class="genre-link" data-genre="Rock">Rock</button>
        <button type="button" class="genre-link" data-genre="Pop">Pop</button>
        <button type="button" class="genre-link" data-genre="Otros">Otros</button>
      </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
      <!-- Barra superior con buscador -->
      <header class="top-nav">
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="localSearchInput" placeholder="¿Qué quieres escuchar hoy?" />
        </div>
      </header>

      <!-- Secciones estilo Spotify / Grid de tarjetas -->
      <section class="shelf-section">
        <div class="shelf-header">
          <h2 id="sectionTitle">Tus Canciones</h2>
          <span id="trackCount" class="shelf-count">0 canciones</span>
        </div>

        <!-- Estado vacío -->
        <div id="emptyState" class="empty-shelf" style="display: none;">
          <div class="empty-icon">📁</div>
          <h3>Tu biblioteca está vacía</h3>
          <p>Sube canciones desde tu dispositivo o ve a la sección de descargas.</p>
        </div>

        <!-- Cuadrícula de tarjetas con portada -->
        <div id="songsGrid" class="cards-grid"></div>
      </section>
    </main>
  </div>

  <!-- REPRODUCTOR FIJO INFERIOR -->
  <footer class="bottom-player">
    <div class="current-track-info">
      <div class="mini-cover" id="playerMiniCover">♫</div>
      <div class="track-meta-box">
        <p id="nowPlayingTitle" class="now-title">Selecciona una pista</p>
        <p id="nowPlayingMeta" class="now-sub">YŪGEN Music</p>
      </div>
    </div>

    <div class="player-center">
      <div class="controls">
        <button type="button" class="btn-ctrl" id="prevBtn" title="Anterior">⏮</button>
        <button type="button" class="btn-ctrl play" id="playPauseBtn" title="Reproducir">▶</button>
        <button type="button" class="btn-ctrl" id="nextBtn" title="Siguiente">⏭</button>
      </div>

      <div class="progress-container">
        <span id="currentTime">0:00</span>
        <input type="range" id="progressBar" min="0" max="100" value="0" />
        <span id="totalDuration">0:00</span>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
